.topbar.on-light .topbar-divider{background:rgba(30,54,73,.15)}
.topbar.on-light .nav-button:hover{background:rgba(33,75,95,.07)}
.topbar.on-light .mode-control{background:rgba(16,57,76,.035);border-color:rgba(30,61,83,.16)}
.topbar.on-light .mode-control button{color:#687c90}
.topbar.on-light .mode-control button.is-selected{color:#0e3449;background:#fff;box-shadow:0 1px 5px rgba(14,48,70,.11)}

/* A repeated tile must share a baseline with the tile next to it. */
.pillar-grid{align-items:stretch}
.pillar{display:grid!important;grid-template-rows:32px minmax(0,1fr);gap:19px;align-content:start;justify-content:stretch!important;min-height:207px;padding-top:30px}
.pillar>div:last-child{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:10px;min-width:0}
.pillar h3{margin:0!important;line-height:1.1;text-wrap:balance;max-width:100%}
.pillar p{margin:0!important}
.question-grid{align-items:stretch}
.question-card{grid-template-rows:24px 1fr;gap:20px;min-height:190px}
.question-card h3{align-self:start;line-height:1.13;text-wrap:balance}

/* Commission comparison: one responsive editorial picture, not a wide spreadsheet. */
.commission-benchmark{margin-top:34px;display:grid;grid-template-columns:minmax(260px,.77fr) minmax(0,1.23fr);gap:clamp(30px,5vw,70px);align-items:stretch}
.benchmark-hero{background:#081d31;border-radius:18px;color:white;padding:clamp(25px,3.3vw,45px);display:flex;flex-direction:column;justify-content:space-between;min-height:390px;position:relative;overflow:hidden;isolation:isolate}
.benchmark-hero:after{content:'';position:absolute;width:270px;height:270px;right:-85px;top:-85px;border-radius:50%;background:radial-gradient(circle,#2c9f9d66,transparent 68%);z-index:-1}
.benchmark-kicker{font-size:10px;letter-spacing:.18em;color:#9df0e5;font-weight:750}
.benchmark-big{font-size:clamp(82px,10vw,158px);font-weight:730;letter-spacing:-.11em;line-height:.94;white-space:nowrap;font-variant-numeric:tabular-nums;margin:22px 0 13px}
.benchmark-big small{font-size:.44em;vertical-align:middle;letter-spacing:-.06em}
.benchmark-hero p{max-width:340px;color:#d9e8ef;font-size:clamp(17px,1.4vw,22px);line-height:1.4;margin:0 0 24px}
.benchmark-accent{border-top:1px solid rgba(214,255,252,.28);padding-top:20px;color:#add0d9;font-size:14px;line-height:1.55}
.benchmark-accent b{color:white}
.benchmark-list{display:flex;flex-direction:column;gap:13px;padding-top:5px}
.benchmark-row{min-width:0}
.benchmark-meta{display:flex;justify-content:space-between;gap:15px;align-items:baseline;font-size:15px;font-weight:660;color:#173047}
.benchmark-meta strong{font-variant-numeric:tabular-nums;font-size:16px;color:#113d4b;white-space:nowrap}
.benchmark-track{height:7px;background:#e1e8ee;border-radius:10px;margin-top:7px;overflow:hidden}
.benchmark-track span{height:100%;display:block;background:#7798ac;border-radius:10px}
.benchmark-row small{display:block;color:#7b8b99;line-height:1.3;font-size:11px;margin-top:3px}
.benchmark-footnote{max-width:1050px;margin:17px 0 0!important;font-size:11px;line-height:1.45;color:#728397}

/* Cancellation / outstanding installments: separate rule, separate screen. */
.policy-layout{display:grid;grid-template-columns:minmax(0,1.03fr) minmax(0,.97fr);gap:clamp(42px,6vw,105px);align-items:center}
.policy-intro .slide-title{max-width:700px;font-size:clamp(40px,4.55vw,75px)}
.policy-intro .slide-lead{max-width:710px}
.policy-zero{display:flex;gap:26px;align-items:center;margin-top:48px;border-top:1px solid rgba(255,255,255,.25);padding-top:21px}
.policy-zero strong{font-size:clamp(90px,12vw,180px);line-height:.9;letter-spacing:-.09em;font-weight:750;color:#5cead8}
.policy-zero span{font-size:13px;letter-spacing:.16em;line-height:1.5;font-weight:700;color:#caede8}
.policy-diagram{display:flex;flex-direction:column;gap:13px}
.policy-phase{padding:22px 27px;border:1px solid rgba(167,212,224,.21);background:rgba(245,252,255,.04);border-radius:14px;min-height:128px;display:flex;flex-direction:column;justify-content:center}
.policy-phase span{font-size:10px;letter-spacing:.15em;color:#72d6ca;font-weight:750}
.policy-phase strong{font-size:clamp(19px,2vw,29px);font-weight:670;letter-spacing:-.03em;line-height:1.15;margin:10px 0 5px}
.policy-phase p{font-size:13px;color:#acbecc;line-height:1.45;margin:0}
.policy-phase.completed{background:rgba(39,221,189,.1);border-color:rgba(85,235,213,.32)}
.policy-disclaimer{margin-top:27px;color:#8497ac;font-size:11px;line-height:1.5;max-width:1100px}

/* Reduce unnecessary motion and preserve precise line breaks. */
.slide-title,.slide-lead,.question-card h3,.pillar h3{hyphens:none;word-break:normal;overflow-wrap:normal;text-wrap:balance}
.light .slide-title,.light .slide-lead{max-width:min(100%,1160px)}

/* Astrion by Âncora / premium presentation portal / GitHub Pages */
:root{--nav-width:198px;--top-height:86px;--bottom-height:86px;--cyan:#20c4fa;--cyan-soft:#7debff;--side:#031326;--night:#04172f;--nav-bg:#041528}
html,body{width:100%;height:100%;margin:0;background:#05182f;color:#eaf4ff}
body{overflow:hidden;font-family:Inter,"Segoe UI",Arial,Helvetica,sans-serif}
button,a{tap-highlight-color:transparent;-webkit-tap-highlight-color:transparent}
.icon{width:24px;height:24px;display:block;flex:none}
/* HEADER / the fixed luminous navy shell in the reference */
.topbar{height:var(--top-height);position:fixed;inset:0 0 auto;z-index:120;padding:0 3.1vw 0 2.6vw;display:flex;align-items:center;gap:0;border:0;border-bottom:1px solid rgba(104,182,235,.16);background:linear-gradient(110deg,#06162a 0%,#0b2645 44%,#193764 79%,#08213f 100%);box-shadow:0 10px 60px rgba(0,0,0,.18)}
.brand-button{border:0;background:transparent;flex:0 0 auto;display:flex;align-items:center;padding:0;margin:0}
.header-logo-astrion{width:209px;height:64px;display:block;object-fit:contain}
.brand-divider{height:36px;width:1px;background:#a7bed3;margin:0 24px 0 16px;opacity:.7}
.brand-by{font-size:20px;line-height:1;color:#c1cad8;letter-spacing:-.03em;margin-right:11px}
.ancora-logo-wrap{display:flex;align-items:center;justify-content:flex-start;width:164px;height:70px}
.header-logo-ancora{width:159px;height:65px;display:block;object-fit:contain}
.header-presentation{font-size:15px;color:#f3f9ff;margin-left:auto;padding:0 33px 0 10px;white-space:nowrap;font-weight:500}
.header-presentation span{display:inline-block;color:#6b95c6;margin:0 22px}
.header-partner{height:53px;padding:0 25px;border:1.5px solid #a9e2ff;border-radius:18px;color:#f1faff;text-decoration:none;background:linear-gradient(135deg,rgba(3,54,91,.3),rgba(17,94,140,.13));font-size:16px;font-weight:650;white-space:nowrap;display:flex;align-items:center;gap:12px;transition:background .2s,box-shadow .2s,transform .2s}
.header-partner .icon{width:25px;height:25px}.header-partner:hover{background:rgba(26,150,204,.27);box-shadow:0 0 24px rgba(23,181,238,.17);transform:translateY(-1px)}
.mobile-open{display:none}
/* SIDEBAR */
.site-sidebar{position:fixed;top:var(--top-height);left:0;bottom:var(--bottom-height);width:var(--nav-width);z-index:93;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,#051527 5%,#061b32 72%,#031428 100%);border-right:1px solid rgba(102,184,240,.11);padding:58px 10px 16px;overflow-x:hidden;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#143a62 transparent}
.sidebar-links{display:flex;flex-direction:column;gap:4px;width:100%}
.side-link{border:1px solid transparent;background:transparent;color:#ebf3fc;border-radius:13px;padding:13px 15px;min-height:45px;display:flex;align-items:center;gap:13px;text-align:left;font-size:13.5px;font-weight:510;line-height:1.3;white-space:nowrap;transition:all .16s}
.side-link .icon{width:22px;height:22px;color:#d3e8f6;stroke-width:1.65}
.side-link:hover{background:#113b5c;color:#fff}
.side-link.side-active{background:linear-gradient(100deg,#075b97 0%,#073e72 100%);border-color:#1377b8;box-shadow:inset 3px 0 0 #25d0ff;color:#fff}
.side-link.side-active .icon{color:#94e8ff}
.sidebar-foot{display:flex;flex-direction:column;gap:8px}
.sidebar-mode{display:flex;align-items:center;gap:10px;min-height:57px;border:1px solid rgba(83,165,231,.46);background:rgba(6,40,76,.84);border-radius:12px;color:#eaf5ff;padding:8px 11px;font-size:12px;text-align:left}
.sidebar-mode .icon{width:22px;height:22px}.sidebar-mode span{line-height:1.28}.sidebar-mode .corner-icon{margin-left:auto;width:17px;height:17px}
.sidebar-explore{border:0;background:transparent;color:#8baac4;font-size:11px;padding:2px;text-align:center;min-height:24px}
.sidebar-explore:hover{color:#d1f3ff}.sidebar-close{display:none}
.sidebar-scrim{display:none}
/* FRAME / footer */
.stage.mode-deck{position:fixed;top:var(--top-height);bottom:var(--bottom-height);left:var(--nav-width);right:0;width:auto;height:auto;background:linear-gradient(160deg,#061a34,#06172f);overflow:hidden}
.stage.mode-explore{position:fixed;top:var(--top-height);bottom:0;left:var(--nav-width);right:0;width:auto;height:auto;overflow-x:hidden;overflow-y:auto;scroll-snap-type:none;background:#061a34}
.bottom-controls{position:fixed;inset:auto 0 0 0;height:var(--bottom-height);z-index:114;padding:0 3.1vw 0 2.6vw;display:flex;align-items:center;gap:36px;background:linear-gradient(110deg,#051629,#09254a 53%,#103864);border-top:1px solid rgba(24,125,207,.21);box-shadow:0 -12px 35px rgba(0,0,0,.2);color:#edf8ff}
.bottom-controls.on-light{color:#edf8ff}.bottom-controls.on-light .context-index b,.bottom-controls.on-light .context-name{color:#aabdd2}
.bottom-controls.on-light .nav-circle:not(.filled){background:#092947;border-color:#4b7997;color:#f1fbff}
.bottom-context{min-width:54px;gap:12px;justify-content:flex-start;margin-left:0;order:1}
.bottom-context .context-index{font-size:17px;letter-spacing:0;white-space:nowrap;font-weight:560;color:#f3faff}
.bottom-context .context-index b{font-size:15px;color:#b6c7d7;font-weight:400}
.context-name{display:none}
.progress-track{order:2;flex:1;min-width:100px;height:7px;background:rgba(126,174,214,.34);border-radius:9px;overflow:visible}
.progress-track span{height:7px;border-radius:9px;background:linear-gradient(90deg,#00bafb,#47e3ff);box-shadow:0 0 13px rgba(0,181,246,.6);transition:width .35s ease-out}
.bottom-nav{display:flex;align-items:center;order:3}
.bottom-nav:first-child{order:0}
.nav-circle,.bottom-controls.on-light .nav-circle.filled{display:flex;align-items:center;justify-content:center;height:46px;width:46px;flex:none;border:1px solid rgba(168,223,255,.34);background:rgba(52,99,144,.26);color:#effbff;border-radius:50%;box-shadow:none;transition:background .2s,border .2s}
.nav-circle:hover{background:rgba(25,124,193,.34);border-color:#5dcaff}.nav-circle svg{width:23px;height:23px}
/* SLIDES / adapt the previous 69 screens to the shell */
.stage.mode-deck .slide{position:absolute;inset:0;min-height:0;height:100%;overflow-y:auto;overflow-x:hidden;padding:80px clamp(30px,4.25vw,90px) 45px}
.stage.mode-explore .slide{padding:110px clamp(28px,4.25vw,90px) 76px;min-height:min(750px,100dvh)}
.slide{scrollbar-width:thin;scrollbar-color:rgba(117,181,211,.25) transparent}
.slide-top{top:35px;left:clamp(30px,4.25vw,90px);right:clamp(30px,4.25vw,90px)}
.slide-inner{margin:auto;max-width:1320px}
.slide-title{font-size:clamp(33px,4.55vw,74px);line-height:1.06;letter-spacing:-.055em}
.slide-title.small{font-size:clamp(31px,3.55vw,58px);line-height:1.09}
.slide-lead{font-size:clamp(15px,1.42vw,22px);line-height:1.47}
/* Reference homepage: hero + four capabilities + stats, all in a single viewport */
.stage.mode-deck .slide.landing-slide{overflow:hidden;padding:0;min-height:0;height:100%;display:none}
.stage.mode-deck .slide.landing-slide.is-active{display:flex}
.slide.landing-slide{padding:0!important;background:#071a33;color:#f7fbff}
.landing-slide .grain,.landing-slide.has-aurora::before,.landing-slide.has-aurora::after{display:none}
.slide.landing-slide .slide-inner{width:100%;height:100%;max-width:none;margin:0;min-height:0}

function build(){

}
function menuItems(term){let out='',last='';for(const s of S){if(term&&!(s.title+' '+s.lead+' '+CH[s.chapter].name).toLowerCase().includes(term.toLowerCase()))continue;
 if(last!==s.chapter){last=s.chapter;out+=`<div class="menu-group-title">${esc(CH[s.chapter].number)} &nbsp; ${esc(CH[s.chapter].name)}</div>`}
 out+=`<button class="menu-link ${s.number-1===state.index?'is-active':''}" data-jump="${s.number-1}"><span>${String(s.number).padStart(2,'0')}</span><strong>${esc(s.title)}</strong></button>`;
 }return out||'<div style="padding:25px;color:#7b8c9d">Nenhuma tela encontrada.</div>'}
function syncStage(updateHash=true){
 const active=S[state.index];
 document.querySelectorAll('[data-go-chapter]').forEach(el=>{const ch=el.getAttribute('data-go-chapter');el.classList.toggle('side-active',ch===active.chapter && !(ch==='ativacao'&&state.index>=S.length-3))});
 document.querySelectorAll('[data-go-slide]').forEach(el=>el.classList.toggle('side-active',el.dataset.goSlide===active.id));
 $('bottom-controls').classList.toggle('on-light', /\b(light|ivory)\b/.test(colorTheme(active)));
 $('topbar').classList.toggle('on-light', /\b(light|ivory)\b/.test(colorTheme(active)));
 $('stage').querySelectorAll('.slide').forEach((e,i)=>{e.classList.toggle('is-active',i===state.index);if(i===state.index){e.classList.add('is-revealed')} });
 $('current-chapter').textContent=CH[active.chapter].name+' / '+active.title;
 $('bottom-chapter').textContent=CH[active.chapter].name;
 $('counter').innerHTML=String(state.index+1).padStart(2,'0')+` <b>/ ${S.length}</b>`;
 $('progress-fill').style.width=((state.index+1)/S.length*100)+'%';
 $('progress-track').setAttribute('aria-valuenow',String(state.index+1));
 $('prev-slide').disabled=state.index===0;
 $('next-slide').disabled=state.index===S.length-1;
 $('announce').textContent=`Tela ${state.index+1} de ${S.length}: ${active.title}`;
 $('menu-items').innerHTML=menuItems($('slide-search').value);
 $('notes-slide-id').textContent='TELA '+String(active.number).padStart(2,'0')+' / '+CH[active.chapter].name;
 $('notes-slide-title').textContent=active.title;
 let notes=active.notes?.trim() || 'Explique o propósito desta tela, a aplicação para a corretora e o vínculo com a narrativa comercial.';
 notes=notes.replace(/\n\s*Base: fontes identificadas.*$/s,'');
 $('notes-text').innerHTML=notes.split(/\n\s*\n/).filter(Boolean).map(p=>`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('');
 if(updateHash&&state.mode==='deck'){safeHash(active.id)}
}
function safeHash(id){try{history.replaceState(null,'','#'+id)}catch{}}
function go(i,force){let x=Math.max(0,Math.min(S.length-1,i));if(state.index===x&&!force)return;state.index=x;if(state.mode==='deck')$(S[x].id).scrollTop=0;
 if(state.mode==='explore'){const el=$(S[x].id);if(el)el.scrollIntoView({behavior:force?'auto':'smooth',block:'start'});safeHash(S[x].id);}
 syncStage(state.mode==='deck');
}
function setMode(mode){if(state.mode===mode)return;state.mode=mode;
 $('stage').classList.toggle('mode-deck',mode==='deck');$('stage').classList.toggle('mode-explore',mode==='explore');
 $('deck-mode').classList.toggle('is-selected',mode==='deck');$('deck-mode').setAttribute('aria-pressed',String(mode==='deck'));
 $('scroll-mode').classList.toggle('is-selected',mode==='explore');$('scroll-mode').setAttribute('aria-pressed',String(mode==='explore'));
 $('bottom-controls').style.display=mode==='explore'?'none':'flex';
 if(mode==='explore'){const target=$(S[state.index].id);target?.scrollIntoView({behavior:'instant',block:'start'});}else{$('stage').scrollTop=0;}
 syncStage();
}
function showPanel(name){const other=name==='menu-panel'?'notes-panel':'menu-panel';$(other).hidden=true;$(name).hidden=false;
 state.menu=name==='menu-panel';state.notes=name==='notes-panel';$('overlay-shade').hidden=false;
 $('menu-trigger').setAttribute('aria-expanded',String(state.menu));$('notes-trigger').setAttribute('aria-expanded',String(state.notes));
 if(state.menu)setTimeout(()=>$('slide-search').focus(),30);
}
function closePanel(){for(const id of ['menu-panel','notes-panel'])$(id).hidden=true;state.menu=state.notes=false;$('overlay-shade').hidden=true;$('menu-trigger').setAttribute('aria-expanded','false');$('notes-trigger').setAttribute('aria-expanded','false');}
function togglePanel(name){if(!$(name).hidden)closePanel();else showPanel(name)}
function bind(){
 document.querySelectorAll('[data-go-slide]').forEach(b=>b.addEventListener('click',()=>{go(S.findIndex(s=>s.id===b.dataset.goSlide));document.body.classList.remove('nav-open');$('sidebar-trigger').setAttribute('aria-expanded','false')}));
 document.querySelectorAll('[data-go-chapter]').forEach(b=>b.addEventListener('click',()=>{const chapter=b.getAttribute('data-go-chapter');const i=chapter==='abertura'?0:S.findIndex(s=>s.chapter===chapter&&s.kind==='chapter'); if(i>=0)go(i);document.body.classList.remove('nav-open');$('sidebar-trigger')?.setAttribute('aria-expanded','false');}));
 const sideTrigger=$('sidebar-trigger'),sideClose=$('sidebar-close'),sideScrim=$('sidebar-scrim');
 if(sideTrigger)sideTrigger.addEventListener('click',()=>{document.body.classList.toggle('nav-open');sideTrigger.setAttribute('aria-expanded',String(document.body.classList.contains('nav-open')))});
 [sideClose,sideScrim].forEach(b=>b?.addEventListener('click',()=>{document.body.classList.remove('nav-open');sideTrigger?.setAttribute('aria-expanded','false')}));

 $('go-start').addEventListener('click',()=>{closePanel();go(0)})
 $('menu-trigger').addEventListener('click',()=>togglePanel('menu-panel'));
 $('notes-trigger').addEventListener('click',()=>togglePanel('notes-panel'));
 $('overlay-shade').addEventListener('click',closePanel);
 document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closePanel));
 $('slide-search').addEventListener('input',e=>{$('menu-items').innerHTML=menuItems(e.target.value)});
 $('menu-items').addEventListener('click',e=>{const b=e.target.closest('[data-jump]');if(!b)return;closePanel();go(Number(b.dataset.jump));});
 $('deck-mode').addEventListener('click',()=>setMode('deck'));$('scroll-mode').addEventListener('click',()=>setMode('explore'));
 $('prev-slide').addEventListener('click',()=>go(state.index-1));$('next-slide').addEventListener('click',()=>go(state.index+1));
 $('fullscreen-trigger').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){console.warn('Fullscreen indisponível',e)}});
 document.addEventListener('keydown',e=>{
  const inField=e.target.closest('input,select,textarea');
  if(e.key==='Escape'){closePanel();if(document.body.classList.contains('nav-open')){document.body.classList.remove('nav-open');$('sidebar-trigger').setAttribute('aria-expanded','false');$('sidebar-trigger').focus();}return;}
  if(inField||e.target.closest('button,a,[role=dialog]'))return;
  const key=e.key.toLowerCase();
  if(key==='m'){e.preventDefault();togglePanel('menu-panel');return;}
  if(key==='n'){e.preventDefault();togglePanel('notes-panel');return;}
  if(key==='f'){e.preventDefault();$('fullscreen-trigger').click();return;}
  if(state.mode==='deck'&&!state.menu&&!state.notes){
   if(['arrowright','pagedown',' '].includes(key)){e.preventDefault();go(state.index+1)}
   if(['arrowleft','pageup'].includes(key)){e.preventDefault();go(state.index-1)}
   if(key==='home'){e.preventDefault();go(0)} if(key==='end'){e.preventDefault();go(S.length-1)}
  }
 });
 let tx=0,ty=0;
 $('stage').addEventListener('touchstart',e=>{if(state.mode!=='deck'||e.target.closest('input,select,button,a')){tx=0;return;}tx=e.changedTouches[0].screenX;ty=e.changedTouches[0].screenY},{passive:true});
 $('stage').addEventListener('touchend',e=>{if(state.mode!=='deck'||!tx)return;const dx=e.changedTouches[0].screenX-tx,dy=e.changedTouches[0].screenY-ty;tx=0;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.3){go(state.index+(dx<0?1:-1))}},{passive:true});
 $('stage').addEventListener('click',e=>{const b=e.target.closest('[data-chain]');if(!b)return;const i=Number(b.dataset.chain);const slide=b.closest('.slide');slide.querySelectorAll('.chain-node').forEach(btn=>{const active=Number(btn.dataset.chain)===i;btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',String(active))});slide.querySelector('.chain-detail-title').textContent=chainData[i][0];slide.querySelector('.chain-detail-copy').textContent=chainData[i][1]});
 $('stage').addEventListener('input',e=>{
  const t=e.target,id=t.id||'',root=id.endsWith('-entry')?id.slice(0,-6):id;
  if(id.endsWith('-entry')){const slider=$(root);if(slider){const v=Number(t.value),valid=t.value.trim()!==''&&Number.isFinite(v)&&v>=Number(t.min)&&v<=Number(t.max)&&t.validity.stepMismatch===false;t.setAttribute('aria-invalid',String(!valid));let msg=t.closest('.slide').querySelector('.calc-validation');if(!msg){msg=document.createElement('p');msg.className='calc-validation';msg.setAttribute('role','status');t.closest('.sliders').append(msg);}msg.textContent=valid?'':'Informe um valor entre '+t.min+' e '+t.max+', respeitando o intervalo de '+t.step+'.';if(!valid)return;slider.value=v;}}
  else if(t.type==='range'&&$(id+'-entry')){$(id+'-entry').value=t.value;$(id+'-entry').setAttribute('aria-invalid','false');const msg=t.closest('.slide').querySelector('.calc-validation');if(msg)msg.textContent='';}
  if(root.startsWith('calc-'))updateCalculator();if(root.startsWith('comm-'))updateCommission();
  if(root.startsWith('swap-'))updateSwap();if(root.startsWith('lance-'))updateLance();
  if(root.startsWith('bcb-'))updateBenchmark();
 });
 $('stage').addEventListener('change',e=>{if(e.target.id.startsWith('comm-'))updateCommission();if(e.target.id.startsWith('bcb-'))updateBenchmark();});
 if(typeof IntersectionObserver!=='undefined'){
  const io=new IntersectionObserver(entries=>{if(state.mode!=='explore')return;const visible=entries.filter(x=>x.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(!visible)return;const target=Number(visible.target.dataset.index);if(target!==state.index){state.index=target;syncStage(false)}},{root:$('stage'),threshold:[.25,.45,.65,.85]});
  $('stage').querySelectorAll('.slide').forEach(e=>io.observe(e));
 }
 window.addEventListener('hashchange',()=>{const i=S.findIndex(x=>'#'+x.id===window.location.hash);if(i>=0)go(i,true) });
 updateCalculator();updateCommission();updateBenchmark();updateLance();updateSwap();
}
function updateCalculator(){const get=id=>$(id)?Number($(id).value):0;if(!$('calc-credit'))return;
 const credit=get('calc-credit'),term=Math.max(1,get('calc-term')),ta=get('calc-ta'),fr=get('calc-fr');

}

 const embedded=credit*emb/100,offer=cash+embedded;
 for(const [id,v,unit] of [['lance-credit',credit,'money'],['lance-cash',cash,'money'],['lance-embedded',emb,'pct']])$(id+'-out').textContent=unit==='money'?money(v):dec(v)+'%';

}
function updateSwap(){if(!$('swap-credit'))return;const credit=Number($('swap-credit').value),car=Number($('swap-car').value),cash=Number($('swap-cash').value),offer=car+cash;
 for(const [id,v] of [['swap-credit',credit],['swap-car',car],['swap-cash',cash]])$(id+'-out').textContent=money(v);
 $('swap-offer').textContent=money(offer);$('swap-percent').textContent=dec(credit?100*offer/credit:0)+'%';$('swap-vehicle').textContent=money(car);$('swap-own').textContent=money(cash);
}
function updateCommission(){if(!$('comm-credit'))return;
 const credit=Number($('comm-credit').value),sales=Number($('comm-sales').value),plan=Number($('comm-plan').value),horizon=Number($('comm-horizon').value),schedule=commissionSchedules[plan],terms=schedule.length;
 const volume=credit*sales,per=credit*.05,generated=per*sales,all=generated*horizon;
 $('comm-credit-out').textContent=money(credit);$('comm-sales-out').textContent=fmt(sales);
 $('comm-total').textContent=money(generated);$('comm-volume').textContent=money(volume);$('comm-terms').textContent=terms+' parcelas';$('comm-year').textContent=money(all);$('comm-per').textContent=money(per);
 // Um lote de vendas por ciclo. Liberações nominais condicionadas a elegibilidade, sem inferência de datas.
 const periods=Array.from({length:horizon},(_,t)=>{
  let v=0;for(let cohort=0;cohort<=t;cohort++){const offset=t-cohort;if(offset<schedule.length)v+=volume*schedule[offset];}return v;
 });
 const max=Math.max(...periods,1);let released=periods.reduce((a,b)=>a+b,0);
 $('comm-released').textContent=money(released);$('comm-future').textContent=money(Math.max(0,all-released));$('comm-cycle-note').textContent=horizon+' ciclos';

}

(()=>{
let returnFocus=null;
document.querySelectorAll('#menu-trigger,#notes-trigger').forEach(b=>b.addEventListener('click',()=>{returnFocus=b;const panel=document.querySelector('.overlay-panel:not([hidden])');if(panel)panel.querySelector('input,button')?.focus();}));
document.querySelectorAll('[data-close],#overlay-shade').forEach(b=>b.addEventListener('click',()=>returnFocus?.focus()));
document.addEventListener('keydown',e=>{const p=document.querySelector('.overlay-panel:not([hidden])');if(e.key==='Tab'&&p){const f=[...p.querySelectorAll('button,input,a[href],select,[tabindex="0"]')].filter(x=>x.getClientRects().length);if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}if(e.key==='Escape'&&returnFocus&&document.querySelector('.overlay-panel[hidden]'))returnFocus.focus();});
matchMedia('(min-width:971px)').addEventListener('change',()=>{document.body.classList.remove('nav-open');document.getElementById('sidebar-trigger').setAttribute('aria-expanded','false');});
document.querySelectorAll('.commission-table').forEach(x=>{x.tabIndex=0;x.setAttribute('role','region');x.setAttribute('aria-label','Tabela de comissões, deslize horizontalmente quando necessário');});
})();
</script></body></html>
