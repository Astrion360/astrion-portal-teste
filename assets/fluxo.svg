<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Fluxo de consórcio</title><desc id="d">Fluxo de consórcio. Participantes contribuem para recursos do grupo; administradora organiza; contemplações dependem de sorteio ou lance, disponibilidade de recursos e regras contratuais.</desc><style><![CDATA[.bg{fill:#f7f9fc}.card{fill:#ffffff;stroke:#d7e2ee;stroke-width:2}.title{font:700 47px Arial,sans-serif;fill:#132c47}.subtitle{font:400 24px Arial,sans-serif;fill:#51677d}.heading{font:700 27px Arial,sans-serif;fill:#1d3d60}.body{font:400 22px Arial,sans-serif;fill:#51677d}.num{font:700 35px Arial,sans-serif;fill:#122e48}.label{font:600 20px Arial,sans-serif;fill:#395774}.note{font:400 20px Arial,sans-serif;fill:#52667c}.blue{fill:#1e527d}.pale{fill:#edf4fa}.line{fill:none;stroke:#7c98b0;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:#7c98b0}.pill{fill:#eaf2fa}]]></style><rect width="1600" height="900" class="bg"/>
<text x="90" y="104" class="title">Como funciona o grupo de consórcio</text>
<text x="92" y="146" class="subtitle">Os participantes contribuem; a administradora organiza e executa as regras do grupo.</text>
<rect x="90" y="235" width="405" height="390" rx="25" class="card"/>
<text x="130" y="291" class="heading">Consorciados</text>
<rect x="130" y="337" width="315" height="61" rx="14" class="pale"/><text x="157" y="375" class="label">Participante A</text>
<rect x="130" y="421" width="315" height="61" rx="14" class="pale"/><text x="157" y="459" class="label">Participante B</text>
<rect x="130" y="505" width="315" height="61" rx="14" class="pale"/><text x="157" y="543" class="label">Participante C e outros</text>
<rect x="600" y="303" width="420" height="256" rx="25" class="card"/>
<rect x="638" y="341" width="344" height="82" rx="15" class="blue"/><text x="810" y="392" text-anchor="middle" style="font:700 28px Arial;fill:white">Recursos do grupo</text>
<text x="810" y="467" class="body" text-anchor="middle">Fundo comum e demais</text><text x="810" y="497" class="body" text-anchor="middle">recursos com destinação própria</text>
<path d="M 499 430 L 578 430" class="line"/><polygon points="582,430 560,417 560,443" class="arrow"/>
<rect x="1127" y="235" width="379" height="170" rx="25" class="card"/>
<text x="1315" y="296" class="heading" text-anchor="middle">Administradora</text>
<text x="1315" y="343" class="body" text-anchor="middle">Organiza e administra</text><text x="1315" y="374" class="body" text-anchor="middle">grupos e assembleias</text>
<rect x="1127" y="454" width="379" height="171" rx="25" class="card"/>
<text x="1315" y="510" class="heading" text-anchor="middle">Contemplações</text><text x="1315" y="552" class="body" text-anchor="middle">Sorteio ou lance</text><text x="1315" y="584" class="body" text-anchor="middle">e recursos suficientes</text>
<path d="M1024 506 L1103 537" class="line"/><polygon points="1112,540 1095,522 1088,546" class="arrow"/>
<path d="M1316 409 L1316 445" class="line" stroke-dasharray="10 10"/>
<rect x="92" y="720" width="1414" height="89" rx="18" class="pill"/>
<text x="800" y="762" text-anchor="middle" class="label">A contemplação não tem data garantida e depende das condições do grupo.</text>
<text x="800" y="792" text-anchor="middle" class="note">Diagrama conceitual, sem representação de um produto específico.</text>
</svg>
