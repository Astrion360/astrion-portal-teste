name: Aplicar politica de imagens
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_image_policy.py'
      - '.github/workflows/image-policy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar processamento das fotografias
        run: python3 -m pip install Pillow
      - name: Instalar logo oficial e fotografias dos nove capitulos
        run: python3 scripts/fix_image_policy.py
      - name: Publicar imagens e HTMLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html revisao/index.html assets/chapter-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Publica marca oficial e nove fotos distintas nos capitulos"
            git push
          fi
